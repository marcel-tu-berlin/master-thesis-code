experiment_id: e21-agentic-countdown-cosine-w16-qwen3-1_7b
description: "E21: cosine length reward gets its best-case setting. The polynomial null (e9-e18) has a mechanism: correct episodes sit at the reasoning floor and the slack lives in wrong, cap-bound episodes the correctness-coupled cosine penalizes least. Countdown inverts that: the probe shows accuracy 1.00 at ~982 mean tokens, so every group is all-correct, the env component has zero within-group variance (contributes 0 under advantage_weighted), and the cosine correct-branch (shorter is better) drives the entire gradient. Falsifiable both ways: compression here confirms the mechanism story; a third null in the reward's best case indicts the reward itself. Watch accuracy - if compression comes at accuracy cost, that is the Wu/Yeo overshoot. Pairs with the e20 env-only control."
seed: 42

model:
  slug: qwen3-1.7b
  lora_r: 16
  max_seq_length: 3072

training:
  mode: agentic
  env: reasoning_gym
  env_config:
    dataset: countdown
    size: 500
  env_server:
    repo_path: /workspace/OpenEnv/envs
    port: 8077
  max_prompt_length: 1024
  n_rollouts: 8
  max_steps: 300
  learning_rate: 5e-6
  kl_beta: 0.001

rewards:
  compose_method: advantage_weighted
  env_reward:
    enabled: true
    weight: 1.0
  token_length:
    enabled: true
    weight: 16.0
    max_len: 2048

eval:
  temperature: 0.0
  do_sample: false
  agentic:
    n_episodes: 100
