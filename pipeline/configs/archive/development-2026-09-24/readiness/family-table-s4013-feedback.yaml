experiment_id: family-screen-table-s4013-feedback-v1
description: "read-table-2 corrected-feedback base-policy screen: four questions x eight rollouts; zero-LR warmup step"
seed: 4013

model:
  slug: qwen3-1.7b
  revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  lora_r: 16
  lora_alpha: 32
  load_in_4bit: false
  max_seq_length: 8192
  use_vllm: true
  gpu_memory_utilization: 0.3
  vllm_enable_sleep_mode: false

training:
  mode: agentic
  env: browsergym
  env_config:
    benchmark: miniwob
    tasks: [read-table-2]
    enable_fill: true
    miniwob_url: http://localhost:8080/miniwob/
    max_turns: 8
    size: 4
  env_server:
    repo_path: /workspace/OpenEnv/envs
    port: 8000
  max_prompt_length: 4096
  batch_size: 4
  n_rollouts: 8
  micro_batch_size: 1
  max_steps: 1
  save_steps: 1
  learning_rate: 0.00005
  kl_beta: 0.0
  optim: adamw_torch_fused
  lr_scheduler_type: constant_with_warmup
  warmup_ratio: 0.1
  weight_decay: 0.1
  temperature: 1.0
  vllm_importance_sampling_mode: token_truncate
  num_iterations: 1
  use_liger_kernel: false
  scale_rewards: none
  loss_type: dapo

rewards:
  compose_method: naive_sum
  env_reward:
    enabled: true
    weight: 1.0
  token_length:
    enabled: false
    weight: 1.0
    max_len: 4096
    r_correct_short: 1.0
    r_correct_long: 0.5
    r_wrong_short: -1.0
    r_wrong_long: -0.5
    placebo: false
  non_termination:
    enabled: false
    weight: 1.0
    placebo: false

eval:
  temperature: 0.0
  do_sample: false
  max_new_tokens: 4096
  agentic:
    splits:
      - name: development_unused
        n_episodes: 4
        seed_offset: 700100
