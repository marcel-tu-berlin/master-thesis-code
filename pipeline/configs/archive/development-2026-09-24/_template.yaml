# GRPO Pipeline - Agentic Config Template
# Copy + modify for each experiment. Most fields have defaults; the ones shown
# are the common levers. The pipeline is agentic-only: the model is driven
# through its native tool-calling template and rewarded by a live OpenEnv
# environment, not graded against a dataset answer column.

experiment_id: eX-browsergym-qwen3-1_7b
description: "agentic GRPO on click-menu-2 via OpenEnv, Qwen3-1.7B, vLLM colocate"
seed: 42

model:
  slug: qwen3-1.7b              # key into training/registry.py
  revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  lora_r: 16
  lora_alpha: 32
  load_in_4bit: false
  max_seq_length: 8192
  use_vllm: true
  gpu_memory_utilization: 0.3
  vllm_enable_sleep_mode: false

training:
  mode: agentic                # only `agentic` is supported
  env: browsergym
  env_config:
    benchmark: miniwob
    tasks: [click-menu-2]
    miniwob_url: http://localhost:8080/miniwob/
    max_turns: 8
  env_server:
    # OpenEnv env launched locally (no Docker) by the runner as a subprocess.
    repo_path: /workspace/OpenEnv/envs   # clone of meta-pytorch/OpenEnv
    port: 8000
  max_prompt_length: 4096
  batch_size: 4
  n_rollouts: 8                # GRPO group size
  micro_batch_size: 1
  max_steps: 300
  # Final recipe (decision 0010). Keep every value explicit in each config.
  learning_rate: 0.00005
  kl_beta: 0.0
  optim: adamw_torch_fused     # LoRA state is ~140 MB, 8-bit paging buys nothing
  lr_scheduler_type: constant_with_warmup   # cosine wasted the tail of a 150-step run
  warmup_ratio: 0.1
  weight_decay: 0.1
  temperature: 1.0
  vllm_importance_sampling_mode: token_truncate
  num_iterations: 1           # decision 0012: one update per fresh rollout batch
  use_liger_kernel: false      # decision 0011: current fused loss is not equivalent
  scale_rewards: none          # preserve shaped-reward weights as actual doses
  loss_type: dapo              # token-normalized loss, pinned instead of implicit

rewards:
  compose_method: naive_sum

  # Task-success signal from the environment. The live signal in agentic mode.
  env_reward:
    enabled: true
    weight: 1.0

  # Cosine length shape (Wu/Yeo): correct -> prefer shorter, wrong -> prefer
  # longer. Correctness comes from env.reward > 0. Survives advantage_weighted
  # per-group z-scoring because it is non-linear in length and correctness-gated.
  token_length:
    enabled: false
    weight: 1.0
    max_len: 4096
    r_correct_short: 1.0
    r_correct_long: 0.5
    r_wrong_short: -1.0
    r_wrong_long: -0.5
    # placebo: true uniformly shuffles this signal within each prompt-group.
    # It preserves the component values and has zero expected centered
    # contribution per position, but need not match total-reward variance or
    # gradient noise. This is a control arm, not a condition.
    placebo: false

  # E3: -1 per episode that ran out of budget (turn cap or completion budget)
  # without the env reporting done. Stopping early is NOT penalized - it is the
  # off-target behavior the panel measures. lambda is `weight`; run the sweep
  # under compose_method naive_sum and scale_rewards none|batch.
  non_termination:
    enabled: false
    weight: 1.0
    placebo: false

eval:
  temperature: 0.0
  do_sample: false
  # max_new_tokens defaults to the training completion budget (max_seq -
  # max_prompt_length); set explicitly only to override.
  agentic:
    n_episodes: 100            # held-out episodes (seeds disjoint from training)
