experiment_id: e23-countdown-cap-probe-16k
description: "E23: cap probe on countdown, eval only, no training. Countdown is far more cap-bound than polynomial: under the strict correctness threshold e20/e21 score 0.36/0.32, and 100% of the 64-68 failed episodes sit exactly at the 2048 cap while the correct tail reaches 2013. Unlike polynomial (where correct episodes stop on their own well below the cap), countdown's correct branch is pressed against it, so the cap constrains the very episodes the cosine reward is supposed to compress. This re-evaluates the e20 (env-only) checkpoint on the first 20 held-out seeds with a 16384 budget to measure where episodes actually terminate when given room, and how many currently-failing episodes become correct. That distribution sets the training cap and the cosine max_len for the follow-up pair. Sample index i maps to seed 100042+i, so it diffs sample-by-sample against the e20 report. Budget comes from --max_new_tokens 16384; run with --checkpoint runs/e20-agentic-countdown-env-only-qwen3-1_7b/checkpoint-final."
seed: 42

model:
  slug: qwen3-1.7b
  lora_r: 16
  max_seq_length: 3072

training:
  mode: agentic
  env: reasoning_gym
  env_config:
    dataset: countdown
    size: 500
  env_server:
    repo_path: /workspace/OpenEnv/envs
    port: 8077
  max_prompt_length: 1024
  n_rollouts: 8
  max_steps: 300
  learning_rate: 5e-6
  kl_beta: 0.001

rewards:
  compose_method: advantage_weighted
  env_reward:
    enabled: true
    weight: 1.0

eval:
  temperature: 0.0
  do_sample: false
  agentic:
    n_episodes: 20
