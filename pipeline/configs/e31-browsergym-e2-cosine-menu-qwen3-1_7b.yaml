experiment_id: e31-browsergym-e2-cosine-menu-qwen3-1_7b
description: "E2 on the fixed trainer: e30's recipe with the cosine length reward (Wu/Yeo 2025) added and nothing else changed, so e30 is literally this run's lambda=0 control - same seed, task set, geometry, learning rate, importance-sampling mode, composer, splits and reference report. Launched after the e30 gate passed on 2026-08-14: held_out 1.000 [0.981, 1.000] against e0m's 0.595, paired McNemar p=8.3e-25 with zero regressions, training reward 0.562 to 0.912 over 150 steps. The question this arm asks is sharpened by the gate result: e30 already compressed incidentally (paired median -643 tokens on the 119 jointly-correct held-out episodes, mean steps 3.09 to 2.61, training mean length 2750 at its mid-run peak down to 1818 by step 150), so E2 measures what an explicit length reward buys BEYOND the compression task success alone delivers - and what it costs, since compression bought with correctness is the Wu/Yeo overshoot and a stop-without-acting shortcut is RQ2's substitution read directly off the off-target panel. max_len 4096 equals the whole-trajectory budget completions actually live in (e30 bucket means 1818-2750). Weight 1.0; e28bs4's description holds the algebra for why weight is a structurally weak lever under naive_sum (sixteenfold weight change moves the length share of the advantage range by 1.5x, asymptote ~0.1). naive_sum matches e30 for the same reason it matched e27bs4: the control must be the lambda=0 point of the same composer. Read this arm against e30's report only - the e27bs4/e28bs4 pair trained under the sequence_mask ISR filter (run-mean ISR 0.28) and a two-task mix, and neither number carries over."
seed: 42

model:
  slug: qwen3-1.7b
  # Initial prompt is small (lead-in, goal, first page: about 700 tokens), and
  # the whole trajectory is capped at 4096 below, so 8192 leaves slack.
  max_seq_length: 8192
  lora_r: 16
  gpu_memory_utilization: 0.30

training:
  mode: agentic
  env: browsergym
  env_config:
    benchmark: miniwob
    # Menu-only (C4): every seed maps to click-menu-2, so the whole batch is
    # the one family with headroom. Even seeds produce the same questions the
    # mixed e27bs4 campaign drew for menu, odd seeds are new menu questions.
    tasks: [click-menu-2]
    # MiniWoB HTML is not shipped with browsergym-miniwob. This must point at a
    # served clone of miniwob-plusplus or the env raises "core is not defined"
    # at the first reset, and it does not survive a box restart. Start it first:
    #   cd /workspace/miniwob-plusplus/miniwob/html && python3 -m http.server 8080
    miniwob_url: http://localhost:8080/miniwob/
    # The one turn cap. Menu-2 needs 2.6 steps, so 8 is headroom.
    max_turns: 8
  env_server:
    repo_path: /workspace/OpenEnv/envs
    port: 8000
  # Sets TRL's max_completion_length to 8192 - 4096 = 4096, the budget for the
  # WHOLE trajectory. Menu-2's worst case lands near 4124 tokens (45-token
  # pages measured through the adapter), so truncation stays rare.
  max_prompt_length: 4096
  # Geometry stated explicitly so the frozen config records it. This arm must
  # differ from e30 in exactly the rewards.token_length block and nothing else;
  # the diff of the two frozen configs is the proof.
  batch_size: 4
  n_rollouts: 8
  micro_batch_size: 1
  max_steps: 150
  # 10x the e27bs4 campaign's 5e-6: top of the probe ladder's monotone
  # dose-response, stable at 50 steps. e30 ran it to 150 steps clean
  # (grad_norm flat, KL settling near 0.10 under kl_beta 0.001).
  learning_rate: 5e-5
  kl_beta: 0.001
  # Recipe this arm trained under, pinned. The runner defaults moved to
  # adamw_torch_fused / constant_with_warmup / kl_beta 0.0 on 2026-08-24
  # (LAB_NOTES), so a re-run of this config reproduces the run on disk only
  # because the old values are stated here rather than inherited. This
  # campaign is closed: no further runs on the old recipe (decision 2026-08-24).
  optim: paged_adamw_8bit
  lr_scheduler_type: cosine
  # The trainer fix (commit a975c40). The TRL 1.6 default, sequence_mask,
  # zeroes or collapses the per-sequence weight of long completions and starved
  # menu-2 of gradient in every earlier browsergym run.
  vllm_importance_sampling_mode: token_truncate

rewards:
  # Matches e30, so e30 is the lambda=0 point of the same code path.
  compose_method: naive_sum
  env_reward:
    enabled: true
    weight: 1.0
  token_length:
    enabled: true
    weight: 1.0
    max_len: 4096

eval:
  temperature: 0.0
  do_sample: false
  # Pinned, not derived. Budget for the WHOLE trajectory, matching TRL's
  # max_completion_length in training. Every arm of the campaign must state the
  # same value or the comparison is measured under two different budgets.
  max_new_tokens: 4096
  # Thinking rates are measured against the paired base model's token
  # distribution, not this run's own percentiles, so every arm of the campaign
  # is scored on one ruler.
  reference_report: runs/e0m-browsergym-base-menu-qwen3-1_7b/eval_report.json
  agentic:
    splits:
      # Held-out: menu-2 questions from this seed's block, disjoint from the
      # training seeds via the offset. n=200 per the campaign power plan.
      - name: held_out
        n_episodes: 200
      # Shifted: three families never trained on. click-dialog-2 (base 0.80)
      # detects substitution in both directions; navigate-tree and
      # click-checkboxes-transfer (at ceiling) detect degradation. 50 episodes
      # per family via seed % 3.
      - name: shifted
        n_episodes: 150
        env_config:
          tasks: [click-dialog-2, navigate-tree, click-checkboxes-transfer]
        seed_offset: 200000
