  micro_batch_size: 1
  mode: agentic
  n_rollouts: 8
  num_iterations: 1
  optim: adamw_torch_fused
  save_steps: 100
  scale_rewards: none
  temperature: 1.0
  use_liger_kernel: false
  vllm_importance_sampling_mode: token_truncate
  warmup_ratio: 0.1
  weight_decay: 0.1
