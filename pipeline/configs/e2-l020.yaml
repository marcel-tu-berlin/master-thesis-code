    weight: 1.0
  successful_length:
    enabled: true
    kind: relative
    weight: 0.2
    max_len: 4096
    placebo: false
  token_length:
    enabled: false
  non_termination:
    enabled: false
seed: 4016
training:
  batch_size: 4
  env: browsergym
