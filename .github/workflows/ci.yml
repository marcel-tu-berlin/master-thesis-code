name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.2"
          enable-cache: true

      # The same two commands the lockfile header documents, so CI's venv is the
      # one the tests are pinned against. --torch-backend=cpu keeps the CUDA
      # wheel out: requirements-test.lock.txt is the CPU-only suite's lock, and
      # nothing in tests/ touches a GPU.
      - run: uv venv .venv-test --python 3.12.6
      - run: >-
          uv pip install --python .venv-test/bin/python
          -r requirements-test.lock.txt --torch-backend=cpu

      # One step, because .claude/check.sh IS the gate. Running the pieces
      # separately here would let CI and a local run drift apart.
      - run: ./.claude/check.sh
